<!DOCTYPE html>
<html>
<head><title>Data Check</title></head>
<body style="font-family:sans-serif;padding:20px">
<h3>Exercise Data Check</h3>
<button id="login" onclick="doLogin()" style="padding:12px 24px;font-size:14px;background:#4285f4;color:#fff;border:none;border-radius:6px;cursor:pointer">Sign in with Google</button>
<div id="s" style="margin-top:10px"></div>
<pre id="o" style="background:#f5f5f5;padding:10px;overflow:auto;max-height:80vh;font-size:11px"></pre>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyDnNHlqyEg3IVxYo9M6Z_pfn5ABMp7Jbt4",authDomain:"life-care-app-64d04.firebaseapp.com",databaseURL:"https://life-care-app-64d04-default-rtdb.europe-west1.firebasedatabase.app",projectId:"life-care-app-64d04"});

function doLogin(){
  var provider = new firebase.auth.GoogleAuthProvider();
  firebase.auth().signInWithPopup(provider).then(function(result){
    document.getElementById("login").style.display="none";
    document.getElementById("s").textContent="Signed in as "+result.user.email+". Reading...";
    readData();
  }).catch(function(e){
    document.getElementById("s").textContent="Login error: "+e.message;
  });
}

function readData(){
  firebase.database().ref("data").once("value").then(function(snap){
    if(!snap.exists()){document.getElementById("s").textContent="No data at /data";return;}
    var all=snap.val();
    var keys=Object.keys(all);
    
    // Find dashboard_data
    var dd=all["dashboard_data"];
    if(!dd){
      // Try dashboard:data with colon replaced
      dd=all["dashboard:data"];
    }
    
    if(dd){
      try{
        var d=typeof dd==="string"?JSON.parse(dd):dd;
        var r={};
        ["jc","becks"].forEach(function(p){
          if(d[p]&&d[p].exercises){
            r[p]={};
            Object.keys(d[p].exercises).forEach(function(day){
              r[p][day]=d[p].exercises[day].map(function(ex){
                return{name:ex.name,current:ex.current,reps:ex.reps,progCount:(ex.prog||[]).length,lastEntry:ex.prog&&ex.prog.length?ex.prog[ex.prog.length-1]:null};
              });
            });
          }
        });
        document.getElementById("s").textContent="Exercise data found ("+keys.length+" total keys):";
        document.getElementById("o").textContent=JSON.stringify(r,null,2);
      }catch(e){
        document.getElementById("s").textContent="Parse error. Raw type: "+typeof dd;
        document.getElementById("o").textContent=String(dd).substring(0,2000);
      }
    } else {
      document.getElementById("s").textContent=keys.length+" keys found. No dashboard_data. Keys:";
      document.getElementById("o").textContent=keys.join("\n");
    }
  }).catch(function(e){
    document.getElementById("s").textContent="Read error: "+e.message;
  });
}

// Auto-check if already signed in
firebase.auth().onAuthStateChanged(function(user){
  if(user){
    document.getElementById("login").style.display="none";
    document.getElementById("s").textContent="Already signed in. Reading...";
    readData();
  }
});
</script>
</body>
</html>
