# Post-deploy smoke test of prod, beta and build: each page loads, shows the sign-in screen with no console errors, and
# runs the version its branch says; plus the real data and the build copy are present (counts only).
# Prepared 12 Nov 2026, inactive until JC adds FIREBASE_SERVICE_ACCOUNT (missing → "secret not set — skipped", green).
name: Smoke test after deploy

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Check the secret is set
        id: s
        run: if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then echo "FIREBASE_SERVICE_ACCOUNT secret not set — skipped."; echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.s.outputs.skip == 'false'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - if: steps.s.outputs.skip == 'false'
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Expected versions (from each branch)
        if: steps.s.outputs.skip == 'false'
        run: |
          v() { git show "origin/$1:src/constants/version.js" | sed -n 's/.*APP_VERSION_BASE = "\(v[0-9.]*\)".*/\1/p'; }
          echo "EXPECTED_VERSIONS={\"prod\":\"$(v main)\",\"beta\":\"$(v beta)\",\"build\":\"$(v build)\"}" >> "$GITHUB_ENV"
      - if: steps.s.outputs.skip == 'false'
        run: |
          npm install --no-save --no-package-lock --prefix scripts/automation firebase-admin@12.7.0 playwright@1.63.0
          npx --prefix scripts/automation playwright install --with-deps chromium
      - if: steps.s.outputs.skip == 'false'
        run: node scripts/automation/smoke.mjs
