# v2.16.1 SAD-A5: CodeQL code scanning (JavaScript + workflow files). Results: Security → Code scanning.
name: CodeQL
on:
  push: { branches: [main, beta, build] }
  pull_request: { branches: [main, beta, build] }
  schedule: [{ cron: "23 3 * * 1" }]
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with: { languages: "${{ matrix.language }}", queries: security-extended }
      - uses: github/codeql-action/analyze@v3
        with: { category: "/language:${{ matrix.language }}" }
