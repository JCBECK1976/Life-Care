# Deploys Lifecare Companion to GitHub Pages (Settings → Pages → Source: GitHub Actions).
#
# - main has package.json (the Vite app, v2.0.0+): install → lint → build → deploy dist/
# - main has no package.json (before the Vite merge, or after reverting it): publish
#   main's files exactly as they are, i.e. the legacy single-file app. This keeps the
#   site up while the Pages source is switched, and makes a full revert a real rollback.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install, lint and build the Vite app
        if: hashFiles('package.json') != ''
        run: |
          npm ci
          npm run build   # = lint (0 errors required) + vite build, base /Life-Care/

      - name: Legacy single file (no package.json on main)
        if: hashFiles('package.json') == ''
        run: |
          mkdir -p dist
          for f in $(ls -A); do
            case "$f" in .git|.github|dist) ;; *) cp -r "$f" dist/ ;; esac
          done

      - name: Check the build has the app and the Help guide
        run: |
          test -f dist/index.html
          test -f dist/APP_GUIDE.md
          ls dist

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
