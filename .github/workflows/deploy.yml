# Deploys Lifecare Companion to GitHub Pages (Settings → Pages → Source: GitHub Actions).
# One Pages artifact holds all three environments (see scripts/build-pages.sh):
#   main → /Life-Care/ (prod) · beta → /Life-Care/beta/ · build → /Life-Care/build/
#
# Only main's copy of this workflow builds and deploys. A push to build or beta just asks
# main's workflow to rebuild everything, so a change on build can never change how prod is
# deployed, and the github-pages environment only ever deploys from main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, beta, build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  request-deploy:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Ask main's workflow to rebuild all environments
        run: gh workflow run deploy.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: pages-build
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # all branches and history (beta.N counts promotions since the last release)

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build prod, beta and build, then check the result
        run: bash scripts/build-pages.sh dist-pages

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
