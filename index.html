<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  <title>Lifecare Companion™</title>
  <link rel="manifest" href="data:application/json,{%22name%22:%22My%20Lifecare%20Companion%22,%22short_name%22:%22LifeCare%22,%22start_url%22:%22/%22,%22display%22:%22standalone%22,%22background_color%22:%22%230f172a%22,%22theme_color%22:%22%230f172a%22}">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; }
    #root { max-width: 480px; margin: 0 auto; min-height: 100vh; }
    @keyframes dotPulse {
      0%, 20% { opacity: 0.3; }
      50% { opacity: 1; }
      80%, 100% { opacity: 0.3; }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-dots span { animation: dotPulse 1.4s infinite; font-size: 18px; }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
    /* Loading screen: shown by this file before JavaScript runs, and by React's LoadingScreen */
    .boot { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
    .boot img { width: 220px; height: 220px; display: block; border-radius: 50%; }
    .boot p { margin-top: 16px; color: #94a3b8; font-size: 14px; font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>
</head>
<body>
  <div id="root"><div class="boot"><img src="/brand/app-logo-640.png" alt="Lifecare Companion" width="220" height="220"><p>Loading Lifecare Companion™…</p></div></div>

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
