function getWeekDates(s) { const d = []; for (let i = 0; i < 7; i++) { const x = new Date(s); x.setDate(x.getDate() + i); d.push(x); } return d; }
function fmtDate(d) { return d.toLocaleDateString("en-GB", { day: "numeric", month: "short" }); }
function mealKey(ws) { const d = new Date(ws); return "mealplan:" + d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function countStatus(ex) {
  const seen = new Set();
  const all = [...(ex.sunday||[]), ...(ex.monday||[]), ...(ex.friday||[])];
  const unique = all.filter(e => { if (seen.has(e.name)) return false; seen.add(e.name); return true; });
  return { movedUp: unique.filter(e => e.status === "moved up").length, ready: unique.filter(e => e.status === "ready to move").length, building: unique.filter(e => e.status === "building").length, consolidating: unique.filter(e => e.status === "consolidating").length, maintaining: unique.filter(e => e.status === "maintaining").length, reduce: unique.filter(e => e.status === "reduce").length, total: unique.length };
}
const sColor = s => s === "moved up" ? "#16a34a" : s === "ready to move" ? "#2563eb" : s === "building" ? "#7c3aed" : s === "consolidating" ? "#d97706" : s === "maintaining" ? "#0891b2" : s === "reduce" ? "#dc2626" : "#64748b";
const sBg = s => s === "moved up" ? "#dcfce7" : s === "ready to move" ? "#dbeafe" : s === "building" ? "#ede9fe" : s === "consolidating" ? "#fef3c7" : s === "maintaining" ? "#cffafe" : s === "reduce" ? "#fee2e2" : "#f1f5f9";
const sLabel = s => s === "moved up" ? "Moved Up" : s === "ready to move" ? "Ready to Move" : s === "building" ? "Building" : s === "consolidating" ? "Consolidating" : s === "maintaining" ? "Maintaining" : s === "reduce" ? "Reduce" : s;
function parseReps(str) { if (!str) return []; const s = String(str); if (s.includes("×")) { const p = s.split("×"); return Array(parseInt(p[1])||3).fill(parseInt(p[0])||0); } return s.split("/").map(n => parseInt(n)||0); }
function fmtReps(arr) { if (!arr || arr.length === 0) return ""; if (arr.every(r => r === arr[0])) return arr[0] + "×" + arr.length; return arr.join("/"); }
function autoStatus(newWeight, newReps, prevProg) {
  const kg = parseInt(newWeight) || 0;
  const prevEntry = prevProg && prevProg.length > 0 ? prevProg[prevProg.length - 1] : null;
  const prevKg = prevEntry ? (parseInt(prevEntry.w) || 0) : 0;
  if (kg > prevKg) return "moved up";
  const reps = parseReps(newReps);
  if (reps.length === 0) return "building";
  if (reps.every(r => r >= 15)) { const pr = prevEntry ? parseReps(prevEntry.r) : []; return (pr.length > 0 && pr.every(r => r >= 15)) ? "ready to move" : "consolidating"; }
  return "building";
}

function MiniChart({ data, color, height = 48, width = 140 }) {
  if (!data || data.length < 2) return null;
  const vals = data.map(d => d.v).filter(v => typeof v === "number");
  if (vals.length < 2) return null;
  const mn = Math.min(...vals), mx = Math.max(...vals), sp = (mx - mn) * 0.3;
  const lo = mn - sp, hi = mx + sp, rng = hi - lo || 1;
  const pts = vals.map((v, i) => ((i / (vals.length - 1)) * width) + "," + (height - ((v - lo) / rng) * height)).join(" ");
  return (<svg width={width} height={height} style={{ display: "block" }}><polyline points={pts} fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />{vals.map((v, i) => <circle key={i} cx={(i / (vals.length - 1)) * width} cy={height - ((v - lo) / rng) * height} r="3.5" fill={color} />)}</svg>);
}

function FullChart({ series, height = 160, title, refLine }) {
  const W = 320, PAD = 36, PR = 16, PB = 20, PT = 8;
  const cW = W - PAD - PR, cH = height - PB - PT;
  let allVals = [], allWks = [];
  series.forEach(s => s.data.forEach(d => { if (typeof d.v === "number") { allVals.push(d.v); allWks.push(d.wk); } }));
  if (refLine) allVals.push(refLine);
  if (allVals.length === 0) return <div style={{ fontSize: 11, color: "#94a3b8", padding: 12 }}>No data yet</div>;
  const mn = Math.min(...allVals), mx = Math.max(...allVals), sp = (mx - mn) * 0.15 || 1;
  const lo = mn - sp, hi = mx + sp, rng = hi - lo || 1;
  const wks = [...new Set(allWks)].sort((a, b) => a - b);
  const x = wk => PAD + ((wks.indexOf(wk)) / Math.max(wks.length - 1, 1)) * cW;
  const y = v => PT + cH - ((v - lo) / rng) * cH;
  return (
    <div style={{ background: "#fff", borderRadius: 10, border: "1px solid #e2e8f0", padding: "10px 8px", marginBottom: 10 }}>
      {title && <div style={{ fontSize: 11, fontWeight: 700, color: "#475569", marginBottom: 6, paddingLeft: 4 }}>{title}</div>}
      <svg viewBox={"0 0 " + W + " " + height} style={{ width: "100%", height: "auto" }}>
        {wks.map(wk => (<text key={wk} x={x(wk)} y={height - 4} textAnchor="middle" fontSize="9" fill="#94a3b8">W{wk}</text>))}
        {refLine && <line x1={PAD} x2={W - PR} y1={y(refLine)} y2={y(refLine)} stroke="#ef4444" strokeWidth="1" strokeDasharray="4,3" opacity="0.5" />}
        {refLine && <text x={PAD - 2} y={y(refLine) + 3} textAnchor="end" fontSize="8" fill="#ef4444">{refLine}</text>}
        {series.map((s, si) => {
          const pts = s.data.filter(d => typeof d.v === "number");
          if (pts.length < 1) return null;
          const line = pts.map(d => x(d.wk) + "," + y(d.v)).join(" ");
          return (<g key={si}>
            {pts.length > 1 && <polyline points={line} fill="none" stroke={s.color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" opacity={series.length > 3 ? 0.8 : 1} />}
            {pts.map((d, i) => <circle key={i} cx={x(d.wk)} cy={y(d.v)} r={series.length > 5 ? 2.5 : 3} fill={s.color} />)}
            {series.length <= 3 && pts.map((d, i) => <text key={"t"+i} x={x(d.wk)} y={y(d.v) - 6} textAnchor="middle" fontSize="8" fill={s.color} fontWeight="600">{typeof d.v === "number" ? (d.v % 1 === 0 ? d.v : d.v.toFixed(1)) : d.v}</text>)}
          </g>);
        })}
      </svg>
      {series.length > 1 && <div style={{ display: "flex", flexWrap: "wrap", gap: 8, paddingLeft: 4, marginTop: 4 }}>
        {series.map((s, i) => <div key={i} style={{ fontSize: 9, display: "flex", alignItems: "center", gap: 3 }}><span style={{ width: 8, height: 8, borderRadius: "50%", background: s.color }} />{s.label}</div>)}
      </div>}
    </div>
  );
}

function StrengthBanner({ exercises, isJC }) {
  const all = [...(exercises.sunday||[]), ...(exercises.monday||[]), ...(exercises.friday||[])];
  const active = all.filter(e => e.status !== "reduce");
  const weights = active.map(e => parseInt(e.current) || 0);
  const avgWeight = weights.length > 0 ? Math.round(weights.reduce((a, b) => a + b, 0) / weights.length) : 0;
  const maxWeight = Math.max(...weights, 0);
  const movedUp = all.filter(e => e.status === "moved up" || e.status === "ready to move").length;
  const ratio = movedUp / all.length;
  let uLo, uHi, aLo, aHi;
  if (isJC) { uLo = 70 + Math.min(ratio * 15, 15); uHi = Math.min(uLo + 8, 95); aLo = uLo - 10; aHi = Math.min(uHi - 8, 95); }
  else { uLo = 88 + Math.min(ratio * 5, 7); uHi = Math.min(uLo + 5, 98); aLo = uLo - 8; aHi = Math.min(uHi - 6, 98); }
  const grad = isJC ? "linear-gradient(135deg, #1e3a5f 0%, #2563eb 100%)" : "linear-gradient(135deg, #5b21b6 0%, #a855f7 100%)";
  return (<div style={{ background: grad, borderRadius: 10, padding: "12px 14px", marginBottom: 14, color: "#fff" }}>
    <div style={{ fontSize: 10, fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.1em", opacity: 0.8, marginBottom: 6 }}>Strength vs {isJC ? "Male" : "Female"} Population (age {isJC ? "49" : "48"})</div>
    <div style={{ display: "flex", gap: 12 }}>
      <div style={{ flex: 1 }}><div style={{ fontSize: 22, fontWeight: 800, lineHeight: 1 }}>Top {Math.round(100 - uHi)}–{Math.round(100 - uLo)}%</div><div style={{ fontSize: 10, opacity: 0.7, marginTop: 2 }}>untrained</div></div>
      <div style={{ width: 1, background: "rgba(255,255,255,0.2)" }} />

    </div>
    <div style={{ fontSize: 9, opacity: 0.5, marginTop: 6 }}>Estimated from cable machine performance · avg {avgWeight}kg · max {maxWeight}kg</div>
  </div>);
}

// STORAGE HELPERS (bulletproof)
// ═══════════════════════════════════════════════════
async function sGet(key) {
  try {
    var snap = await firebase.database().ref("data/" + key.replace(/[.#$/\[\]]/g, "_")).once("value");
    return snap.exists() ? snap.val() : null;
  } catch(e) { return null; }
}
async function sSet(key, val) {
  try {
    await firebase.database().ref("data/" + key.replace(/[.#$/\[\]]/g, "_")).set(val);

// Loading button with animated dots
function LoadingBtn(props) {
  var loading = props.loading;
  var label = props.label || "Generate";
  var loadLabel = props.loadLabel || "Generating";
  return React.createElement("button", {
    onClick: props.onClick,
    disabled: loading || props.disabled,
    style: Object.assign({}, {
      width: "100%", padding: 12, color: "#fff", border: "none", borderRadius: 8,
      fontSize: 13, fontWeight: 700, cursor: loading ? "not-allowed" : "pointer",
      opacity: loading ? 0.7 : 1, background: loading ? "#94a3b8" : (props.bg || "#2563eb"),
      marginTop: props.mt || 10, position: "relative"
    }, props.style || {})
  }, loading ? React.createElement("span", null,
    loadLabel + " ",
    React.createElement("span", { className: "loading-dots", dangerouslySetInnerHTML: { __html: "<span>.</span><span>.</span><span>.</span>" } })
  ) : label);
}

// Handle API errors - detect credit exhaustion
function handleApiError(result) {
  if (result && result.error) {
    var msg = result.error.message || JSON.stringify(result.error);
    if (msg.indexOf("credit") >= 0 || msg.indexOf("billing") >= 0 || msg.indexOf("payment") >= 0 || msg.indexOf("insufficient") >= 0) {
      return "Out of Credits — please add more credits at console.anthropic.com";
    }
    if (msg.indexOf("rate") >= 0 || msg.indexOf("limit") >= 0) {
      return "Rate limit reached — wait a moment and try again";
    }
    if (msg.indexOf("authentication") >= 0 || msg.indexOf("api_key") >= 0 || msg.indexOf("invalid") >= 0) {
      return "Invalid API key — check your key in Admin settings";
    }
    return "Error: " + msg.substring(0, 150);
  }
  return null;
}


// Calculate current training week from start date
function calcWeek(startDate) {
  var start = new Date(startDate || "2026-07-19");
  var now = new Date();
  return Math.floor((now - start) / (7 * 24 * 60 * 60 * 1000)) + 1;
}

// Map feedback icon text to actual symbols
function fbIcon(icon) {
  if (!icon) return "\u25CF";
  var i = icon.toLowerCase().trim();
  if (i === "check" || i.indexOf("check") >= 0 || i === "good") return "\u2705";
  if (i === "arrow" || i.indexOf("arrow") >= 0 || i.indexOf("build") >= 0) return "\u2197\uFE0F";
  if (i === "triangle" || i.indexOf("triangle") >= 0 || i.indexOf("up") >= 0 || i.indexOf("moved") >= 0) return "\u25B2";
  if (i === "warning" || i.indexOf("warning") >= 0 || i.indexOf("watch") >= 0) return "\u26A0\uFE0F";
  if (i === "circle" || i.indexOf("circle") >= 0 || i.indexOf("hold") >= 0 || i.indexOf("maintain") >= 0) return "\u23F8\uFE0F";
  if (i === "star" || i.indexOf("star") >= 0 || i.indexOf("ready") >= 0) return "\u2B50";
  return icon;
}

              const response = await fetch("https://api.anthropic.com/v1/messages", { method: "POST", headers: { "Content-Type": "application/json", "x-api-key": window._anthropicKey || "", "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" }, body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 1500, messages: [{ role: "user", content: prompt }] }) });

              const text = result.content?.map(c => c.text || "").join("") || "";
              setGeneratedShop(JSON.parse(text.replace(/```json|```/g, "").trim()));
            } catch { setFormMsg("✗ Could not generate — try again"); setTimeout(() => setFormMsg(""), 3000); }
            setShopLoading(false);
          }} disabled={shopLoading} style={{ ...btnP(!shopLoading), marginBottom: 14, background: shopLoading ? "#94a3b8" : "linear-gradient(135deg, #059669 0%, #10b981 100%)" }}>{shopLoading ? <span>Generating shop, please wait <span className="loading-dots" dangerouslySetInnerHTML={{ __html: "<span>.</span><span>.</span><span>.</span>" }} /></span> : "🛒 Generate " + supermarket + " Shop"}</button>
          {generatedShop && generatedShop.aisles && (<div style={{ marginBottom: 14 }}>
            {generatedShop.aisles.map((aisle, ai) => (<div key={ai} style={{ background: "#fff", borderRadius: 10, border: "1px solid #e2e8f0", marginBottom: 8, overflow: "hidden" }}>
              <div style={{ padding: "8px 12px", background: "#f8fafc", fontWeight: 700, fontSize: 12, color: "#475569", borderBottom: "1px solid #e2e8f0" }}>{aisle.name}</div>
              {aisle.items.map((it, ii) => (<div key={ii} style={{ display: "flex", justifyContent: "space-between", padding: "6px 12px", borderBottom: ii < aisle.items.length - 1 ? "1px solid #f1f5f9" : "none", fontSize: 12 }}>
                <span>{it.item} {it.qty && it.qty !== "1" ? <span style={{ color: "#3b82f6", fontWeight: 600 }}>×{it.qty}</span> : ""}</span>
                {it.note && <span style={{ fontSize: 10, color: "#94a3b8" }}>{it.note}</span>}
              </div>))}
            </div>))}
          </div>)}
          {!generatedShop && shopList.length > 0 && (<div style={{ background: "#fff", borderRadius: 10, border: "1px solid #e2e8f0", overflow: "hidden", marginBottom: 14 }}>{shopList.map(([it, ct], i) => (<div key={it} style={{ display: "flex", justifyContent: "space-between", padding: "10px 12px", borderBottom: i < shopList.length - 1 ? "1px solid #f1f5f9" : "none" }}><span style={{ fontSize: 13 }}>{it}</span>{ct > 1 && <span style={{ fontSize: 11, fontWeight: 600, color: "#3b82f6", background: "#eff6ff", padding: "2px 8px", borderRadius: 10 }}>×{ct}</span>}</div>))}</div>)}
          {!generatedShop && shopList.length === 0 && <div style={{ textAlign: "center", padding: 40, color: "#94a3b8" }}>Plan dinners on the Dietary tab first, then generate your shop.</div>}
          <div style={{ fontSize: 13, fontWeight: 700, marginTop: 8, marginBottom: 8 }}>Weekly Staples</div>
          <div style={{ background: "#fff", borderRadius: 10, border: "1px solid #e2e8f0", padding: 12, fontSize: 12, color: "#475569", lineHeight: 1.8 }}>
            <div style={{ fontWeight: 600, color: "#166534", marginBottom: 4 }}>Portfolio Diet</div>Brooklea Cholesterol Drink (Beck) · ProActiv · Morrisons Oats · Pumpkin seeds · Sunflower seeds · Frozen berries
            <div style={{ fontWeight: 600, color: "#1e293b", marginTop: 8, marginBottom: 4 }}>Protein & Dairy</div>Chicken breast strips · Eggs · Half-fat cheddar · Fromage frais · Skimmed milk · Alpro almond (JC) · Babybel Light
            <div style={{ fontWeight: 600, color: "#1e293b", marginTop: 8, marginBottom: 4 }}>Snacks</div>Brooklea protein mousses · Lindahls Kvarg · Popcorn · Snack-a-Jacks · Trek/Nakd bars · Aldi porridge pots (JC)
            <div style={{ fontWeight: 600, color: "#1e293b", marginTop: 8, marginBottom: 4 }}>Veg</div>Frozen peas · Sweetcorn · Broccoli · Carrots · Courgette · Cucumber · Tomatoes · Salad · Bananas (Beck)
            <div style={{ fontWeight: 600, color: "#1e293b", marginTop: 8, marginBottom: 4 }}>Bread & Carbs</div>Aldi Super Seeded (138 kcal/slice) · Wholemeal wraps · Wholemeal pitta
          </div>
        </div>)}

        {/* TARGETS */}
        {section === "targets" && (() => {
          const tp = isJC ? { who: "JC", co: "#1e40af", lo: 2000, hi: 2200, w: 2400, tgts: ["Calories: 2,000–2,200", "Protein: 110–130g", "Sat fat: <20g", "Sugar: <25g", "Fibre: 30–35g"], base: JC_BASE, kk: "jcKcal" } : { who: "Beck", co: "#be185d", lo: 1700, hi: 1900, w: 1900, tgts: ["Calories: 1,700–1,900", "Protein: 90–110g", "Sat fat: <20g (critical)", "Sugar: <25g", "Fibre: 25–30g"], base: BECK_BASE, kk: "beckKcal" };
          const prof = p.profile || {};
          return (<div>
          <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 4 }}>{tp.who}'s Targets</div>
          <div style={{ fontSize: 11, color: "#64748b", marginBottom: 12 }}>{prof.height || ""} · Ideal {prof.idealWeight || ""} · {prof.bodyType || ""}</div>
          <div style={{ background: "#fff", borderRadius: 10, border: "1px solid #e2e8f0", padding: 12, marginBottom: 10 }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: tp.co, textTransform: "uppercase", marginBottom: 8 }}>Daily Nutrition</div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6, fontSize: 12, color: "#475569" }}>{tp.tgts.map(t => <div key={t}>{t.split(":")[0]}: <strong>{t.split(":")[1]}</strong></div>)}</div>
            {planned > 0 && (<div style={{ marginTop: 10, borderTop: "1px solid #f1f5f9", paddingTop: 8 }}><div style={{ fontSize: 11, fontWeight: 600, color: "#64748b", marginBottom: 6 }}>This week's daily totals</div>
              {MEAL_DAYS.map((d, di) => { const entry = meals[d.key]; const isO = entry && typeof entry === "object"; const din = isO ? entry.d : entry; const ml = typeof din === "string" ? allDinners.find(m => m.id === din) : null; if (!ml) return null; const tot = tp.base[d.key].bfast + tp.base[d.key].lunch + tp.base[d.key].snacks + ml[tp.kk]; const ok = tot >= tp.lo && tot <= tp.w; return (<div key={d.key} style={{ display: "flex", justifyContent: "space-between", fontSize: 11, padding: "3px 0", color: ok ? "#166534" : tot > tp.w ? "#991b1b" : "#854d0e" }}><span>{d.label} {fmtDate(weekDates[di])}</span><span style={{ fontWeight: 600 }}>~{tot} {ok ? "✓" : tot > tp.w ? "▲" : "▼"}</span></div>); })}
            </div>)}
          </div>
          <div style={{ background: "#fff", borderRadius: 10, border: "1px solid #e2e8f0", padding: 12, marginBottom: 10 }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: tp.co, textTransform: "uppercase", marginBottom: 8 }}>Body Composition</div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6, fontSize: 12, color: "#475569" }}>
              <div>Weight: <strong>{prof.idealWeight || "—"}</strong></div>
              <div>Body Fat: <strong>{isJC ? "15-18%" : "24-28%"}</strong></div>
              <div>Waist: <strong>{isJC ? "<94cm" : "<80cm then 70-75cm"}</strong></div>
              <div>Visceral: <strong>{isJC ? "<10" : "<12"}</strong></div>
            </div>
          </div>
          {isJC ? <div style={{ background: "#dbeafe", borderRadius: 10, padding: 12, fontSize: 12, color: "#1e40af", lineHeight: 1.5 }}>Medical priority: TSH stabilisation → unlocks statin effectiveness → lipid improvement. HbA1c monitoring — thyroid normalisation expected to help.</div>
          : <div style={{ background: "#ede9fe", borderRadius: 10, padding: 12, fontSize: 12, color: "#5b21b6", lineHeight: 1.5 }}>Medical priority: Lipid clinic referral → statin + ezetimibe, FH genetic confirmation. Menopause review. Atorvastatin fatigue at GP review. Portfolio Diet at ~70-75% coverage.</div>}
          <button onClick={async () => {
            setTargetsLoading(true);
            try {
              const prof = p.profile || {};
              const prompt = "You are a health and fitness coach creating personalised targets for " + (prof.name || "this person") + " (" + (prof.sex || "") + ", " + (prof.age || "") + ", " + (prof.height || "") + ", " + (prof.bodyType || "") + ", ideal weight " + (prof.idealWeight || "") + ". " + (prof.notes || "") + ").\n\nCurrent data:\nExercises: " + JSON.stringify(p.exercises) + "\nBody: " + JSON.stringify(p.body) + "\nMeasurements: " + JSON.stringify(p.measurements) + "\nBloods: " + JSON.stringify(p.bloods || []) + "\nMeds: " + JSON.stringify((p.meds || []).filter(m => m.active).map(m => m.name + " " + m.dosage)) + "\nHealth: " + JSON.stringify((p.healthLog || []).slice(-3)) + "\n\nGenerate personalised targets across all domains. Return ONLY JSON:\n{\"nutrition\":{\"calories\":\"...\",\"protein\":\"...\",\"satFat\":\"...\",\"sugar\":\"...\",\"fibre\":\"...\"},\"bodyComp\":{\"weight\":\"...\",\"bodyFat\":\"...\",\"waist\":\"...\",\"visceralFat\":\"...\"},\"exercise\":{\"phase\":\"...\",\"weeklyMins\":\"...\",\"sessions\":\"...\",\"primaryGoal\":\"...\"},\"medical\":{\"priority\":\"...\",\"nextAction\":\"...\",\"bloods\":\"...\"},\"priorities\":[\"top priority 1\",\"priority 2\",\"priority 3\"]}";
              const response = await fetch("https://api.anthropic.com/v1/messages", { method: "POST", headers: { "Content-Type": "application/json", "x-api-key": window._anthropicKey || "", "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" }, body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 2000, messages: [{ role: "user", content: prompt }] }) });
              const result = await response.json();
              const text = result.content?.map(c => c.text || "").join("") || "";
              const parsed = JSON.parse(text.replace(/```json|```/g, "").trim());
              setGeneratedTargets(parsed);
              await sSet("generated_targets_" + activeTab, text.replace(/```json|```/g, "").trim());
            } catch { setGeneratedTargets({ priorities: ["Could not generate — try again"] }); }
            setTargetsLoading(false);
          }} disabled={targetsLoading} style={{ ...btnP(!targetsLoading), marginTop: 14, background: targetsLoading ? "#94a3b8" : "linear-gradient(135deg, #059669 0%, #10b981 100%)" }}>{targetsLoading ? <span>Analysing, please wait <span className="loading-dots" dangerouslySetInnerHTML={{ __html: "<span>.</span><span>.</span><span>.</span>" }} /></span> : "🎯 Generate Personalised Targets"}</button>
          {generatedTargets && (<div style={{ marginTop: 12 }}>
            {generatedTargets.priorities && generatedTargets.priorities.length > 0 && (<div style={{ background: "linear-gradient(135deg, #0f172a 0%, #1e293b 100%)", borderRadius: 12, padding: 14, marginBottom: 10, color: "#fff" }}>
              <div style={{ fontSize: 12, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.1em", opacity: 0.7, marginBottom: 8 }}>Priorities</div>
              {generatedTargets.priorities.map((pr, i) => <div key={i} style={{ fontSize: 13, fontWeight: 600, marginBottom: 4 }}>{i + 1}. {pr}</div>)}
            </div>)}
            {generatedTargets.nutrition && (<div style={{ background: "#fff", borderRadius: 10, border: "1px solid #e2e8f0", padding: 12, marginBottom: 8 }}>
              <div style={{ fontSize: 12, fontWeight: 700, color: "#16a34a", marginBottom: 6 }}>NUTRITION</div>
              {Object.entries(generatedTargets.nutrition).map(function([k, v]) { return <div key={k} style={{ fontSize: 11, color: "#475569", padding: "2px 0" }}>{k}: <strong>{v}</strong></div>; })}
            </div>)}
            {generatedTargets.bodyComp && (<div style={{ background: "#fff", borderRadius: 10, border: "1px solid #e2e8f0", padding: 12, marginBottom: 8 }}>
              <div style={{ fontSize: 12, fontWeight: 700, color: "#2563eb", marginBottom: 6 }}>BODY COMPOSITION</div>
              {Object.entries(generatedTargets.bodyComp).map(function([k, v]) { return <div key={k} style={{ fontSize: 11, color: "#475569", padding: "2px 0" }}>{k}: <strong>{v}</strong></div>; })}
            </div>)}
            {generatedTargets.exercise && (<div style={{ background: "#fff", borderRadius: 10, border: "1px solid #e2e8f0", padding: 12, marginBottom: 8 }}>
              <div style={{ fontSize: 12, fontWeight: 700, color: "#7c3aed", marginBottom: 6 }}>EXERCISE</div>
              {Object.entries(generatedTargets.exercise).map(function([k, v]) { return <div key={k} style={{ fontSize: 11, color: "#475569", padding: "2px 0" }}>{k}: <strong>{v}</strong></div>; })}
            </div>)}
            {generatedTargets.medical && (<div style={{ background: "#fff", borderRadius: 10, border: "1px solid #e2e8f0", padding: 12, marginBottom: 8 }}>
              <div style={{ fontSize: 12, fontWeight: 700, color: "#dc2626", marginBottom: 6 }}>MEDICAL</div>
              {Object.entries(generatedTargets.medical).map(function([k, v]) { return <div key={k} style={{ fontSize: 11, color: "#475569", padding: "2px 0" }}>{k}: <strong>{v}</strong></div>; })}
            </div>)}
          </div>)}
        </div>); })()}

        {/* ADMIN */}
        {section === "admin" && (<div>
          <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 4 }}>Data Admin</div>

          {/* File Attachments */}
          <div style={{ background: "#fff", borderRadius: 12, border: "1px solid #e2e8f0", padding: 14, marginBottom: 14 }}>
            <div style={{ fontSize: 13, fontWeight: 700, color: "#0f172a", marginBottom: 6 }}>📎 Attachments</div>
            <div style={{ fontSize: 11, color: "#64748b", marginBottom: 10 }}>Upload files, images, or documents as data points for Generate Feedback and Ask a Question.</div>
            <label style={{ display: "block", width: "100%", padding: 14, background: "#f8fafc", border: "2px dashed #cbd5e1", borderRadius: 8, textAlign: "center", cursor: "pointer", fontSize: 12, color: "#64748b", marginBottom: 8 }}>
              📄 Tap to upload file (PDF, image, document)
              <input type="file" accept="image/*,.pdf,.doc,.docx,.txt,.csv" multiple onChange={async function(e) {
                var files = e.target.files;
                if (!files || files.length === 0) return;
                var nd = JSON.parse(JSON.stringify(data));
                if (!nd[activeTab].attachments) nd[activeTab].attachments = [];
                for (var fi = 0; fi < files.length; fi++) {
                  var file = files[fi];
                  try {
                    var b64 = await new Promise(function(res, rej) { var r = new FileReader(); r.onload = function() { res(r.result.split(",")[1]); }; r.onerror = function() { rej("fail"); }; r.readAsDataURL(file); });
                    var entry = { name: file.name, type: file.type, size: file.size, date: new Date().toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }), preview: b64.substring(0, 200) };
                    // Try to extract text via Claude API
                    try {
                      var mediaType = file.type || "application/octet-stream";
                      var isImage = mediaType.startsWith("image/");
                      var isPdf = mediaType === "application/pdf";
                      if (isImage || isPdf) {
                        var contentBlock = isImage ? { type: "image", source: { type: "base64", media_type: mediaType, data: b64 } } : { type: "document", source: { type: "base64", media_type: "application/pdf", data: b64 } };
                        var resp = await fetch("https://api.anthropic.com/v1/messages", { method: "POST", headers: { "Content-Type": "application/json", "x-api-key": window._anthropicKey || "", "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" }, body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 1500, messages: [{ role: "user", content: [contentBlock, { type: "text", text: "Extract all key health, fitness, nutrition, and medical data points from this document. Return a concise summary of the important facts, numbers, targets, and recommendations. Plain text, no markdown." }] }] }) });
                        var result = await resp.json();
                        var extracted = "";
                        if (result.content) { for (var ci = 0; ci < result.content.length; ci++) { if (result.content[ci].text) extracted = extracted + result.content[ci].text; } }
                        if (extracted) entry.extracted = extracted;
                      }
                    } catch(apiErr) { entry.extracted = "Could not extract automatically — data will be stored for reference"; }
                    nd[activeTab].attachments.push(entry);
                  } catch(readErr) {}
                }
                if (nd[activeTab].attachments.length > 10) nd[activeTab].attachments = nd[activeTab].attachments.slice(-10);
                await saveData(nd);
                setFormMsg("✓ " + files.length + " file(s) attached"); setTimeout(function() { setFormMsg(""); }, 3000);
                e.target.value = "";
              }} style={{ position: "absolute", width: 1, height: 1, overflow: "hidden", clip: "rect(0,0,0,0)", border: 0 }} />
            </label>
            <div style={{ fontSize: 10, color: "#94a3b8", marginBottom: 8 }}>Upload files to add as data points for Generate Feedback and Ask a Question.</div>
            {/* Show attached files */}
            {p.attachments && p.attachments.length > 0 && (<div>
              <div style={{ fontSize: 11, fontWeight: 600, color: "#475569", marginBottom: 6 }}>Attached Files</div>
              {p.attachments.map(function(att, ai) {
                return (<div key={ai} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 0", borderBottom: "1px solid #f1f5f9" }}>
                  <div>
                    <div style={{ fontSize: 12, fontWeight: 600 }}>📄 {att.name}</div>
                    <div style={{ fontSize: 10, color: "#94a3b8" }}>{att.date} · {att.size ? Math.round(att.size / 1024) + "KB" : ""}</div>
                    {att.extracted && <div style={{ fontSize: 10, color: "#16a34a", marginTop: 2 }}>✓ Data extracted</div>}
                  </div>
                  <button onClick={async function() { var nd = JSON.parse(JSON.stringify(data)); nd[activeTab].attachments.splice(ai, 1); await saveData(nd); }} style={{ fontSize: 10, color: "#dc2626", background: "none", border: "none", cursor: "pointer" }}>Remove</button>
                </div>);
              })}
            </div>)}
          </div>

          {/* API Key */}
          <div style={{ background: "#fff", borderRadius: 12, border: "1px solid #e2e8f0", padding: 14, marginBottom: 14 }}>
            <div style={{ fontSize: 13, fontWeight: 700, color: "#0f172a", marginBottom: 6 }}>🔑 API Keys</div>
            <div style={{ fontSize: 10, color: "#64748b", lineHeight: 1.5, marginBottom: 8 }}>Required for AI features. Get your Claude key from <strong>console.anthropic.com</strong> → API Keys.</div>
            <label style={labelStyle}>Claude API Key</label>
            <input type="password" id="api-key-input" defaultValue="" placeholder="sk-ant-api03-..." style={{ width: "100%", padding: "8px 10px", border: "1px solid #e2e8f0", borderRadius: 6, fontSize: 11, fontFamily: "monospace", boxSizing: "border-box", marginBottom: 6 }} />
            <button onClick={async function() { var key = document.getElementById("api-key-input").value.trim(); if (!key) return; await sSet("anthropic_api_key", key); window._anthropicKey = key; setFormMsg("✓ Claude API key saved"); setTimeout(function() { setFormMsg(""); }, 3000); }} style={{ ...btnP(), width: "100%", marginBottom: 10 }}>Save Claude Key</button>
            <label style={labelStyle}>Google OAuth Client ID (for Health Connect)</label>
            <div style={{ fontSize: 10, color: "#64748b", marginBottom: 4 }}>From Google Cloud Console → APIs & Services → Credentials → OAuth 2.0 Client ID</div>
            <input type="text" id="google-client-id-input" defaultValue="" placeholder="xxxx.apps.googleusercontent.com" style={{ width: "100%", padding: "8px 10px", border: "1px solid #e2e8f0", borderRadius: 6, fontSize: 11, fontFamily: "monospace", boxSizing: "border-box", marginBottom: 6 }} />
            <button onClick={async function() { var gid = document.getElementById("google-client-id-input").value.trim(); if (!gid) return; await sSet("google_client_id", gid); setFormMsg("✓ Google Client ID saved"); setTimeout(function() { setFormMsg(""); }, 3000); }} style={{ ...btnP(), width: "100%" }}>Save Google Client ID</button>
          </div>

          {/* Reset to Defaults */}
          <div style={{ background: "#fff", borderRadius: 12, border: "1px solid #e2e8f0", padding: 14, marginBottom: 14 }}>
            <div style={{ fontSize: 13, fontWeight: 700, color: "#dc2626", marginBottom: 6 }}>⚠ Reset Data</div>
            <div style={{ fontSize: 10, color: "#64748b", marginBottom: 8 }}>Overwrites Firebase with the clean default data. Use if data has become corrupted from bugs. This cannot be undone.</div>
            <button onClick={async function() { if (!confirm("This will reset ALL data to defaults. Are you sure?")) return; await sSet("life_care_data", JSON.stringify(DEFAULT_DATA)); setFormMsg("✓ Data reset to defaults — reload the app"); setTimeout(function() { setFormMsg(""); }, 5000); }} style={{ width: "100%", padding: 10, background: "#fee2e2", color: "#991b1b", border: "1px solid #fca5a5", borderRadius: 8, fontSize: 12, fontWeight: 700, cursor: "pointer" }}>Reset to Default Data</button>
          </div>

          {/* Debug Mode */}
          <div style={{ background: "#fff", borderRadius: 12, border: "1px solid #e2e8f0", padding: 14, marginBottom: 14 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: "#0f172a" }}>🔧 Debug Mode</div>
              <button onClick={function() { setDebugMode(!debugMode); if (!debugMode) setDebugLog([]); }} style={{ padding: "6px 14px", background: debugMode ? "#dc2626" : "#f1f5f9", color: debugMode ? "#fff" : "#475569", border: "none", borderRadius: 6, fontSize: 11, fontWeight: 600, cursor: "pointer" }}>{debugMode ? "ON — Turn Off" : "Turn On"}</button>
            </div>
            {debugMode && (<div style={{ marginTop: 10 }}>
              <div style={{ fontSize: 10, color: "#dc2626", fontWeight: 600, marginBottom: 6 }}>API calls will log raw responses here. Try Generate Feedback or Ask a Question.</div>
              {debugLog.length === 0 && <div style={{ fontSize: 11, color: "#94a3b8", padding: 8 }}>No API calls yet.</div>}
              {debugLog.map(function(log, li) { return (<div key={li} style={{ padding: 8, background: li === 0 ? "#fef3c7" : "#f8fafc", borderRadius: 6, marginBottom: 4, fontSize: 10, fontFamily: "monospace", wordBreak: "break-all", lineHeight: 1.5 }}>
                <div style={{ fontWeight: 700, color: "#0f172a" }}>{log.time} — {log.action}</div>
                {log.status !== undefined && <div>HTTP: <strong>{log.status} {log.statusText}</strong></div>}
                {log.data && <div style={{ color: "#475569", marginTop: 2 }}>{log.data}</div>}
              </div>); })}
              {debugLog.length > 0 && <button onClick={function() { setDebugLog([]); }} style={{ fontSize: 10, color: "#64748b", background: "#f1f5f9", border: "none", borderRadius: 4, padding: "4px 8px", cursor: "pointer", marginTop: 4 }}>Clear Log</button>}
            </div>)}
          </div>
        </div>)}
      </div>

      <div style={{ padding: "12px 16px 20px", textAlign: "center", fontSize: 10, color: "#94a3b8", borderTop: "1px solid #e2e8f0", marginTop: 8 }}>
        Life Care Dashboard · © Jan-Christian Zaluski 2026 · Install: Android tap ⋮ · iPhone tap ⬆ then "Add to Home Screen"
      </div>
    </div>
  );
}


    ReactDOM.createRoot(document.getElementById("root")).render(<Dashboard />);
  </script>
</body>
